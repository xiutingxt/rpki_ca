server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    client_max_body_size 128m;

    location /rfc8181/ {
        proxy_pass https://krill:3000;
        # Krill's internal TLS is self-signed; external client TLS remains verified.
        proxy_ssl_verify off;
        proxy_read_timeout 60s;
    }

    location = /rrdp/notification.xml {
        alias /var/krill/data/repo/rrdp/notification.xml;
        add_header Cache-Control "no-cache" always;
    }
    location /rrdp/ {
        alias /var/krill/data/repo/rrdp/;
    }
    # Administrative access is available only via docker compose exec krill.
    location / { return 404; }
}
