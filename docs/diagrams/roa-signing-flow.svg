<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">ROA 签发调用流程图</title>
  <desc id="desc">从客户端请求开始，经 API、应用服务、资源校验、对象签名、状态保存和仓库原子发布的完整流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.11"/></filter>
    <style>
      .bg{fill:#f8fafc}.phase{fill:#fff;stroke:#cbd5e1;stroke-width:2}.request{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.validate{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.sign{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.publish{fill:#ffedd5;stroke:#ea580c;stroke-width:2}.done{fill:#fef3c7;stroke:#d97706;stroke-width:2}.title{font:700 34px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#0f172a}.subtitle{font:400 17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#475569}.phase-title{font:700 18px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#334155}.node-title{font:700 17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#0f172a}.node-text{font:400 14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#334155}.step{font:700 14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#fff}.edge{fill:none;stroke:#475569;stroke-width:2.4;marker-end:url(#arrow)}.failure{fill:none;stroke:#dc2626;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}.failure-text{font:600 13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#b91c1c}
    </style>
  </defs>
  <rect class="bg" width="1600" height="980"/>
  <text class="title" x="70" y="62">ROA 签发调用流程</text>
  <text class="subtitle" x="70" y="94">HTTP 与 CLI 在进入 CaManager 后共享同一条校验、签名和发布链路</text>

  <rect class="phase" x="55" y="130" width="1490" height="790" rx="18" filter="url(#shadow)"/>
  <line x1="350" y1="130" x2="350" y2="920" stroke="#e2e8f0" stroke-width="2"/><line x1="695" y1="130" x2="695" y2="920" stroke="#e2e8f0" stroke-width="2"/><line x1="1040" y1="130" x2="1040" y2="920" stroke="#e2e8f0" stroke-width="2"/><line x1="1325" y1="130" x2="1325" y2="920" stroke="#e2e8f0" stroke-width="2"/>
  <text class="phase-title" x="202" y="165" text-anchor="middle">1 · 接入</text><text class="phase-title" x="522" y="165" text-anchor="middle">2 · 校验与授权</text><text class="phase-title" x="867" y="165" text-anchor="middle">3 · 签发</text><text class="phase-title" x="1182" y="165" text-anchor="middle">4 · 状态与发布</text><text class="phase-title" x="1435" y="165" text-anchor="middle">5 · 响应</text>

  <rect class="request" x="95" y="205" width="215" height="80" rx="10"/><circle cx="115" cy="225" r="14" fill="#0284c7"/><text class="step" x="115" y="230" text-anchor="middle">1</text><text class="node-title" x="202" y="237" text-anchor="middle">客户端请求</text><text class="node-text" x="202" y="260" text-anchor="middle">ASN + Prefixes</text>
  <rect class="request" x="95" y="345" width="215" height="96" rx="10"/><circle cx="115" cy="365" r="14" fill="#0284c7"/><text class="step" x="115" y="370" text-anchor="middle">2</text><text class="node-title" x="202" y="378" text-anchor="middle">HTTP API / CLI</text><text class="node-text" x="202" y="402" text-anchor="middle">鉴权与幂等</text><text class="node-text" x="202" y="423" text-anchor="middle">转换为 RoaRequest</text>

  <rect class="validate" x="395" y="205" width="255" height="96" rx="10"/><circle cx="417" cy="225" r="14" fill="#7c3aed"/><text class="step" x="417" y="230" text-anchor="middle">3</text><text class="node-title" x="522" y="239" text-anchor="middle">RoaRequest::validate</text><text class="node-text" x="522" y="263" text-anchor="middle">ASN · Prefix · maxLength</text><text class="node-text" x="522" y="283" text-anchor="middle">格式与边界检查</text>
  <rect class="validate" x="395" y="365" width="255" height="96" rx="10"/><circle cx="417" cy="385" r="14" fill="#7c3aed"/><text class="step" x="417" y="390" text-anchor="middle">4</text><text class="node-title" x="522" y="399" text-anchor="middle">获取排他锁</text><text class="node-text" x="522" y="423" text-anchor="middle">API Semaphore</text><text class="node-text" x="522" y="443" text-anchor="middle">StateLock</text>
  <rect class="validate" x="395" y="525" width="255" height="104" rx="10"/><circle cx="417" cy="545" r="14" fill="#7c3aed"/><text class="step" x="417" y="550" text-anchor="middle">5</text><text class="node-title" x="522" y="561" text-anchor="middle">资源覆盖验证</text><text class="node-text" x="522" y="585" text-anchor="middle">CertifiedResources</text><text class="node-text" x="522" y="607" text-anchor="middle">CA 证书是否授权全部前缀</text>

  <rect class="sign" x="740" y="205" width="255" height="96" rx="10"/><circle cx="762" cy="225" r="14" fill="#16a34a"/><text class="step" x="762" y="230" text-anchor="middle">6</text><text class="node-title" x="867" y="239" text-anchor="middle">分配唯一编号</text><text class="node-text" x="867" y="263" text-anchor="middle">EE Serial · CRL Number</text><text class="node-text" x="867" y="283" text-anchor="middle">Manifest Number</text>
  <rect class="sign" x="740" y="365" width="255" height="96" rx="10"/><circle cx="762" cy="385" r="14" fill="#16a34a"/><text class="step" x="762" y="390" text-anchor="middle">7</text><text class="node-title" x="867" y="399" text-anchor="middle">生成并签名 ROA</text><text class="node-text" x="867" y="423" text-anchor="middle">SigningProvider</text><text class="node-text" x="867" y="443" text-anchor="middle">SoftwareSigner · DER 自检</text>
  <rect class="sign" x="740" y="525" width="255" height="104" rx="10"/><circle cx="762" cy="545" r="14" fill="#16a34a"/><text class="step" x="762" y="550" text-anchor="middle">8</text><text class="node-title" x="867" y="561" text-anchor="middle">生成配套对象</text><text class="node-text" x="867" y="585" text-anchor="middle">更新撤销记录与 CRL</text><text class="node-text" x="867" y="607" text-anchor="middle">计算哈希并生成 Manifest</text>

  <rect class="publish" x="1080" y="265" width="205" height="88" rx="10"/><circle cx="1102" cy="285" r="14" fill="#ea580c"/><text class="step" x="1102" y="290" text-anchor="middle">9</text><text class="node-title" x="1182" y="299" text-anchor="middle">保存 CA 状态</text><text class="node-text" x="1182" y="325" text-anchor="middle">state.toml</text>
  <rect class="publish" x="1080" y="445" width="205" height="112" rx="10"/><circle cx="1102" cy="465" r="14" fill="#ea580c"/><text class="step" x="1102" y="470" text-anchor="middle">10</text><text class="node-title" x="1182" y="481" text-anchor="middle">事务化发布</text><text class="node-text" x="1182" y="505" text-anchor="middle">staging → backup</text><text class="node-text" x="1182" y="527" text-anchor="middle">→ repository</text><text class="node-text" x="1182" y="549" text-anchor="middle">失败时恢复旧仓库</text>

  <rect class="done" x="1365" y="345" width="145" height="96" rx="10"/><circle cx="1387" cy="365" r="14" fill="#d97706"/><text class="step" x="1387" y="370" text-anchor="middle">11</text><text class="node-title" x="1437" y="390" text-anchor="middle">返回结果</text><text class="node-text" x="1437" y="414" text-anchor="middle">ID · 对象名</text><text class="node-text" x="1437" y="434" text-anchor="middle">下载地址</text>

  <path class="edge" d="M202 285 V345"/><path class="edge" d="M310 393 H350 V253 H395"/><path class="edge" d="M522 301 V365"/><path class="edge" d="M522 461 V525"/>
  <path class="edge" d="M650 577 H695 V253 H740"/><path class="edge" d="M867 301 V365"/><path class="edge" d="M867 461 V525"/>
  <path class="edge" d="M995 577 H1040 V309 H1080"/><path class="edge" d="M1182 353 V445"/><path class="edge" d="M1285 501 H1325 V393 H1365"/>

  <rect x="395" y="720" width="890" height="120" rx="12" fill="#fff1f2" stroke="#fca5a5" stroke-width="2"/>
  <text class="failure-text" x="430" y="754">任一校验或签名步骤失败</text><text class="node-text" x="430" y="782">返回结构化错误；不发布半成品。状态在仓库切换前持久化，允许烧掉序列号，但绝不复用序列号。</text><text class="node-text" x="430" y="811">同一 Idempotency-Key 的成功请求直接返回原对象；同 key 不同请求被拒绝。</text>
  <path class="failure" d="M522 629 V680 H840 V720"/>
</svg>
